server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nur hier eigener Typ; ein types-Block auf server-Ebene würde alle Standard-MIME-Typen ersetzen
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # Vite-Assets haben Hashes im Namen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Service Worker und Manifest immer frisch, sonst bleiben Updates hängen
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
